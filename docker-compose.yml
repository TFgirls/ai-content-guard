# 一条命令起服务：docker compose up -d
# 查看日志：docker compose logs -f
# 健康状态：docker compose ps（STATUS 列会显示 healthy）

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-content-guard:latest
    container_name: aicg-api

    ports:
      - "8000:8000"

    # 密钥从本地 .env 读，运行时注入。
    # 不要写成 build args 或 COPY 进镜像——那会把 key 固化在镜像层里，
    # 一旦镜像被推到仓库就等于泄露。
    env_file:
      - .env

    environment:
      - TZ=Asia/Shanghai

    # 非正常退出才重启；手动 stop 不会触发
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
